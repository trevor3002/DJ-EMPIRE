<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1035" />
      <stop offset="100%" stop-color="#090610" />
    </radialGradient>
    <linearGradient id="neonCyanPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#ff007a" />
    </linearGradient>
    <linearGradient id="goldBeam" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="100" fill="none" stroke="url(#neonCyanPink)" stroke-width="4" opacity="0.6" />

  <!-- Vinyl Turntable Base -->
  <g transform="translate(256, 266)">
    <circle r="160" fill="#120e22" stroke="#2a1f4a" stroke-width="4" />
    <circle r="140" fill="#0d091a" stroke="#3b2d66" stroke-width="2" />
    <circle r="120" fill="#120e22" stroke="#22183b" stroke-width="1.5" />
    <circle r="100" fill="#0d091a" stroke="#3b2d66" stroke-width="2" />
    <circle r="75" fill="#18112c" stroke="#5b3d99" stroke-width="2" />
    
    <!-- Neon Vinyl Grooves / Waveform Accents -->
    <circle r="50" fill="url(#neonCyanPink)" opacity="0.85" filter="url(#glow)" />
    <circle r="18" fill="#090610" stroke="#00f2fe" stroke-width="3" />
    <circle r="6" fill="#00f2fe" />

    <!-- Tone arm -->
    <path d="M 90 -120 L 120 -80 L 70 30" fill="none" stroke="#a78bfa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="90" cy="-120" r="12" fill="#7c3aed" stroke="#00f2fe" stroke-width="2" />
    <rect x="58" y="24" width="22" height="12" rx="3" fill="#ff007a" transform="rotate(35 69 30)" />
  </g>

  <!-- Giant DJ Headphones Arch -->
  <g filter="url(#glow)">
    <!-- Headband -->
    <path d="M 120 270 C 115 130 397 130 392 270" fill="none" stroke="url(#neonCyanPink)" stroke-width="18" stroke-linecap="round" />
    <path d="M 140 250 C 135 155 377 155 372 250" fill="none" stroke="#090610" stroke-width="6" opacity="0.4" />
    
    <!-- Earcups -->
    <g transform="translate(108, 280)">
      <rect x="-24" y="-45" width="48" height="90" rx="24" fill="#00f2fe" stroke="#ffffff" stroke-width="3" />
      <rect x="-14" y="-35" width="28" height="70" rx="14" fill="#090610" />
    </g>
    <g transform="translate(404, 280)">
      <rect x="-24" y="-45" width="48" height="90" rx="24" fill="#ff007a" stroke="#ffffff" stroke-width="3" />
      <rect x="-14" y="-35" width="28" height="70" rx="14" fill="#090610" />
    </g>
  </g>

  <!-- Crown / Empire Accent -->
  <path d="M 220 98 L 235 135 L 256 108 L 277 135 L 292 98 L 285 148 L 227 148 Z" fill="url(#goldBeam)" filter="url(#glow)" />
  <circle cx="256" cy="95" r="4" fill="#ffedd5" />
</svg>
